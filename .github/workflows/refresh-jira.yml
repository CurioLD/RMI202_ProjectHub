name: Refresh Jira data

on:
  schedule:
    # 7:00am Sydney (AEDT) Monday to Friday = 20:00 UTC Sunday to Thursday.
    # When daylight saving ends in April, change 20 to 21.
    - cron: '0 20 * * 0-4'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-jira
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Pull Jira into project-data.json
        run: node fetch-jira.mjs
        env:
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
      - name: Commit the new data
        run: |
          git config user.name "projecthub-bot"
          git config user.email "projecthub-bot@users.noreply.github.com"
          git add project-data.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Refresh Jira data"
            git push
          fi
